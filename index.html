<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AFTERIMAGE — a first-person roguelite where every death leaves a ghost of you behind." />
    <title>AFTERIMAGE</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="start-overlay">
        <h1>AFTERIMAGE</h1>
        <p class="prompt">click to enter</p>
        <ul class="controls">
          <li><span>WASD</span>move</li>
          <li><span>MOUSE</span>look</li>
          <li><span>SHIFT</span>sprint</li>
          <li><span>CTRL</span>slide (while sprinting)</li>
          <li><span>SPACE</span>jump</li>
          <li><span>Q / E</span>dash</li>
          <li><span>CLICK</span>fire</li>
          <li><span>1 / 2</span>splitter / static</li>
          <li><span>`</span>dev overlay</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
